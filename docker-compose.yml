services:
  redis:
    image: redis:6.0.7
    container_name: redis
    restart: always
    volumes:
      - redis_volume_data:/data
    ports:
      - 6379:6379

  redis_insight:
    image: redislabs/redisinsight:1.14.0
    container_name: redis_insight
    restart: always
    ports:
      - 8001:8001
    volumes:
      - redis_insight_volume_data:/db

  caching_proxy:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: caching_proxy
    restart: always
    env_file:
      - .env
    expose:
      - "${PORT}" 
    environment:
      - REDIS_URL=redis://redis:6379
    command: npx tsx watch app.ts --port ${PORT} --origin ${TARGET_URL}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "4000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - caching_proxy

volumes:
  redis_volume_data:
  redis_insight_volume_data:
